# dsh bundle patch: inserts this plugin into a profile's layer stack.
- insert:
    - id: dsh-ever-autoupdater
      name: 'dsh-ever-autoupdater'
      config:
        enabled: true
        checkOnStart: true
        startupDelayMs: 45000
        scheduleMode: interval
        intervalHours: 3
        dailyTime: '03:30'
        timeZone: ''
        jitterMinutes: 5
        autoApply: true
        maxUpdatesPerRun: 3
        allowPrerelease: false
        skipPackages:
          - dsh-ever-autoupdater
